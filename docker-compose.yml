version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: pulseapi-postgres
    environment:
      POSTGRES_USER: pulseuser
      POSTGRES_PASSWORD: pulsepassword
      POSTGRES_DB: pulseapi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulseuser -d pulseapi"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: pulseapi-backend
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://pulseuser:pulsepassword@postgres:5432/pulseapi
      - JWT_SECRET=supersecretjwtkey_change_me_in_prod
      - PORT=5000
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: ./worker
    container_name: pulseapi-worker
    environment:
      - DATABASE_URL=postgresql://pulseuser:pulsepassword@postgres:5432/pulseapi
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    container_name: pulseapi-frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:5000
    depends_on:
      - backend

volumes:
  postgres_data:
